name: Build QMK firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: rachartier_planck_rev7.json
            qmk_repo: qmk/qmk_firmware
          - file: rachartier_geonix_rev2.json
            qmk_repo: rachartier/qmk_firmware

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.qmk_repo }}
          submodules: recursive
      - name: Checkout userspace
        uses: actions/checkout@v4
        with:
          path: users/${{ github.actor }}

      - name: Build firmware
        run: qmk compile -e "USER_NAME=${{ github.actor }}" "users/${{ github.actor }}/${{ matrix.file }}"
      - name: Archive firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.file }}_${{ github.actor }}
          path: |
            *.hex
            *.bin
            *.uf2
